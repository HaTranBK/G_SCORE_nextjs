app = 'g-score-frontend'
primary_region = 'sin'

[build]
  # NEXT_PUBLIC_* phải biết URL backend lúc build
  # Thay 'g-score-backend' bằng tên app backend thực tế của bạn
  [build.args]
    NEXT_PUBLIC_API_BASE_URL = "https://g-score-backend.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
